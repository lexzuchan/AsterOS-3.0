
name: Build AsterOS Vixenn Edition ISO

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120

    steps:
      - name: Checkout project
        uses: actions/checkout@v4

      - name: Set up Node.js for Vixenn
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vixenn/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libnss3 \
            libatk-bridge2.0-0 \
            libatk1.0-0 \
            libx11-xcb1 \
            libxcomposite1 \
            libxdamage1 \
            libxrandr2 \
            libgbm1 \
            libasound2t64 \
            libgtk-3-0 \
            libdrm2 \
            libxkbcommon0 \
            libxss1 \
            libnspr4 \
            libxfixes3 \
            libxext6 \
            libx11-6 \
            libxcb1 \
            libdbus-1-3 \
            ca-certificates

      - name: Install Vixenn dependencies
        working-directory: vixenn
        shell: bash
        run: |
          set -euxo pipefail

          npm ci --no-audit --no-fund

          echo "Dependencies installed."

      - name: Verify Vixenn browser
        working-directory: vixenn
        shell: bash
        run: |
          set -euxo pipefail

          npm run check

          echo "Checking Electron installation..."

          test -f node_modules/electron/dist/electron

          echo "Electron binary exists."

          echo "Checking application files..."

          test -f package.json

          echo "Vixenn verification completed."

      - name: Install live-image toolchain
        shell: bash
        run: |
          set -euxo pipefail

          sudo apt-get update

          sudo apt-get install -y \
            live-build \
            debootstrap \
            xorriso \
            squashfs-tools \
            mtools \
            dosfstools

      - name: Assemble Debian-based live ISO
        shell: bash
        run: |
          set -euxo pipefail

          sudo bash scripts/build-iso.sh

      - name: Report output
        shell: bash
        run: |
          set -euxo pipefail

          ls -lah output/*.iso

          sha256sum output/*.iso | tee output/SHA256SUMS

      - name: Upload bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: AsterOS-Vixenn-ISO
          path: |
            output/*.iso
            output/SHA256SUMS
          if-no-files-found: error
          retention-days: 7

      - name: Build failure information
        if: failure()
        run: |
          echo "AsterOS ISO build failed."
          echo "Review the failed step above."
          echo "Check dependencies, live-build logs, and ISO output."
