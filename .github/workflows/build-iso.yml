name: Build AsterOS Vixenn Edition ISO
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore: ['**/*.md']
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Checkout project
        uses: actions/checkout@v4
      - name: Set up Node.js for Vixenn
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: vixenn/package-lock.json
      - name: Verify browser and install Electron runtime
        working-directory: vixenn
        run: |
          npm ci --no-audit --no-fund
          npm run check
          test -x node_modules/electron/dist/electron
      - name: Install live-image toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y live-build debootstrap xorriso squashfs-tools mtools dosfstools
      - name: Assemble Debian-based live ISO
        run: sudo bash scripts/build-iso.sh
      - name: Report output
        run: |
          ls -lah output/*.iso
          sha256sum output/*.iso | tee output/SHA256SUMS
      - name: Upload bootable ISO
        uses: actions/upload-artifact@v4
        with:
          name: AsterOS-Vixenn-ISO
          path: |
            output/*.iso
            output/SHA256SUMS
          if-no-files-found: error
          retention-days: 7
